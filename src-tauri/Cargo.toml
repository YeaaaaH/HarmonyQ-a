[package]
name = "harmonyq-a"
version = "0.1.0"
description = "HarmonyQ'a - personal hub for tasks, ideas and promises"
edition = "2021"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "harmonyq_a_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
