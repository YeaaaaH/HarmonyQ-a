[package]
name = "harmonyq-a"
version = "0.1.0"
description = "HarmonyQ'a - personal hub for tasks, ideas and promises"
edition = "2021"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "harmonyq_a_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
